<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>행운의 로또 번호 추첨기</title>
  <style>
    :root {
      --navy: #102a43;
      --navy-deep: #071b2e;
      --blue: #1769e0;
      --blue-dark: #0d4fb3;
      --yellow: #ffd43b;
      --paper: #ffffff;
      --line: #d9e4ef;
      --muted: #52677b;
      --shadow: 0 22px 60px rgba(4, 24, 44, .24);
    }

    * { box-sizing: border-box; }

    html { font-size: 16px; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      min-height: 100dvh;
      padding: clamp(16px, 4vw, 44px) 16px;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
      color: var(--navy);
      background:
        radial-gradient(circle at 15% 10%, rgba(255, 212, 59, .18), transparent 28rem),
        radial-gradient(circle at 90% 90%, rgba(52, 152, 219, .2), transparent 30rem),
        linear-gradient(145deg, #0a2340, #102f50 55%, #071b2e);
    }

    button,
    input { font: inherit; }

    button { touch-action: manipulation; }

    .app {
      width: min(100%, 1060px);
      margin: 0 auto;
      overflow: hidden;
      background: var(--paper);
      border: 1px solid rgba(255, 255, 255, .45);
      border-radius: 28px;
      box-shadow: var(--shadow);
    }

    .hero {
      position: relative;
      padding: clamp(28px, 5vw, 48px) clamp(18px, 5vw, 52px) 26px;
      text-align: center;
      background: linear-gradient(180deg, #f8fbff, #ffffff);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 10px;
      padding: 7px 13px;
      color: #0e5f46;
      background: #def7ec;
      border-radius: 999px;
      font-size: .95rem;
      font-weight: 800;
      letter-spacing: .04em;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.6rem);
      line-height: 1.12;
      letter-spacing: -.045em;
    }

    .intro {
      margin: 14px auto 0;
      color: var(--muted);
      font-size: clamp(1.05rem, 2.4vw, 1.28rem);
      line-height: 1.6;
    }

    .content {
      padding: 0 clamp(16px, 5vw, 52px) clamp(26px, 5vw, 50px);
    }

    .game-picker {
      max-width: 500px;
      margin: 0 auto 22px;
      padding: 6px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      border: 2px solid var(--line);
      border-radius: 18px;
      background: #edf3f8;
    }

    .game-option { position: relative; }

    .game-option input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .game-option label {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid transparent;
      border-radius: 12px;
      color: #40566b;
      background: transparent;
      font-size: 1.2rem;
      font-weight: 900;
      cursor: pointer;
      user-select: none;
    }

    .game-option input:checked + label {
      color: #fff;
      background: var(--blue);
      box-shadow: 0 6px 15px rgba(23, 105, 224, .24);
    }

    .game-option input:focus-visible + label {
      outline: 4px solid #78b0ff;
      outline-offset: 3px;
    }

    #games {
      display: grid;
      gap: 14px;
    }

    .game-card {
      display: grid;
      grid-template-columns: 78px minmax(0, 1fr);
      align-items: center;
      gap: 16px;
      padding: 18px;
      border: 2px solid #e2ebf3;
      border-radius: 22px;
      background: #f8fbfe;
    }

    .game-label {
      margin: 0;
      color: #415b72;
      font-size: 1.08rem;
      font-weight: 900;
      text-align: center;
      line-height: 1.25;
    }

    .balls {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: clamp(8px, 1.4vw, 15px);
    }

    .ball {
      width: 100%;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      font-size: clamp(1.45rem, 3.3vw, 2.25rem);
      font-weight: 1000;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      text-shadow: 0 2px 2px rgba(0, 0, 0, .22);
      box-shadow:
        inset 6px 7px 12px rgba(255, 255, 255, .34),
        inset -8px -10px 14px rgba(0, 0, 0, .2),
        0 7px 12px rgba(15, 42, 66, .2);
      transform: translateZ(0);
    }

    .ball:nth-child(1) { background: #e5a700; color: #17212b; text-shadow: none; }
    .ball:nth-child(2) { background: #2374d8; }
    .ball:nth-child(3) { background: #df3d46; }
    .ball:nth-child(4) { background: #2e9d62; }
    .ball:nth-child(5) { background: #8651c7; }
    .ball:nth-child(6) { background: #e56924; }

    .ball.rolling { animation: wobble .12s ease-in-out infinite alternate; }
    .ball.confirmed { animation: settle .44s cubic-bezier(.2, .9, .3, 1.35); }

    @keyframes wobble {
      from { transform: translateY(-3px) rotate(-4deg); }
      to { transform: translateY(3px) rotate(4deg); }
    }

    @keyframes settle {
      0% { transform: scale(.68); filter: brightness(1.35); }
      70% { transform: scale(1.12); }
      100% { transform: scale(1); filter: brightness(1); }
    }

    .status {
      min-height: 34px;
      margin: 22px 0 15px;
      color: #1f5f48;
      font-size: clamp(1.06rem, 2.3vw, 1.22rem);
      font-weight: 900;
      text-align: center;
      line-height: 1.45;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      max-width: 720px;
      margin: 0 auto;
    }

    .btn {
      min-height: 72px;
      padding: 14px 18px;
      border: 0;
      border-radius: 18px;
      font-size: clamp(1.25rem, 3vw, 1.55rem);
      font-weight: 1000;
      cursor: pointer;
      transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
    }

    .btn:hover:not(:disabled) { transform: translateY(-2px); }
    .btn:active:not(:disabled) { transform: translateY(1px); }

    .btn:focus-visible {
      outline: 4px solid #78b0ff;
      outline-offset: 3px;
    }

    .btn:disabled { opacity: .46; cursor: not-allowed; }

    .btn-primary {
      color: #17212b;
      background: var(--yellow);
      box-shadow: 0 8px 18px rgba(197, 147, 0, .26);
    }

    .btn-primary:hover:not(:disabled) { background: #ffdf63; }

    .btn-secondary {
      color: #fff;
      background: var(--blue);
      box-shadow: 0 8px 18px rgba(23, 105, 224, .24);
    }

    .btn-secondary:hover:not(:disabled) { background: var(--blue-dark); }

    .sub-actions {
      max-width: 720px;
      margin: 12px auto 0;
    }

    .btn-copy {
      width: 100%;
      min-height: 62px;
      color: var(--navy);
      background: #fff;
      border: 3px solid #b9cad9;
      box-shadow: none;
    }

    .note {
      margin: 24px auto 0;
      color: #60758a;
      font-size: .96rem;
      line-height: 1.7;
      text-align: center;
    }

    @media (max-width: 640px) {
      body { padding: 0; background: #fff; }

      .app {
        min-height: 100vh;
        min-height: 100dvh;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .hero { padding: 26px 18px 22px; }
      .intro br { display: none; }
      .content { padding: 0 14px 28px; }

      .game-card {
        grid-template-columns: 1fr;
        gap: 10px;
        padding: 14px;
      }

      .game-label { text-align: left; }

      .balls {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        max-width: 390px;
        margin: 0 auto;
      }

      .ball { font-size: clamp(1.7rem, 9vw, 2.25rem); }

      .actions { grid-template-columns: 1fr; }
      .btn { min-height: 68px; }
    }

    @media (max-width: 370px) {
      .balls { gap: 8px; }
      .game-card { padding: 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="hero">
      <p class="eyebrow" aria-hidden="true">● 오늘의 행운 번호</p>
      <h1>행운의 로또 추첨기</h1>
      <p class="intro">1부터 45까지, 중복 없이 공정하게 뽑아 드려요.<br>원하는 게임 수를 고르고 큰 버튼을 눌러보세요.</p>
    </header>

    <section class="content" aria-label="로또 번호 추첨">
      <fieldset class="game-picker">
        <legend style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">게임 수 선택</legend>
        <div class="game-option">
          <input type="radio" name="gameCount" id="oneGame" value="1" checked>
          <label for="oneGame">1게임</label>
        </div>
        <div class="game-option">
          <input type="radio" name="gameCount" id="fiveGames" value="5">
          <label for="fiveGames">5게임</label>
        </div>
      </fieldset>

      <div id="games" aria-label="추첨 번호"></div>

      <p id="status" class="status" role="status" aria-live="polite">게임 수를 고르고 ‘번호 뽑기’를 눌러주세요.</p>

      <div class="actions">
        <button class="btn btn-primary" id="drawBtn" type="button">번호 뽑기</button>
        <button class="btn btn-secondary" id="redrawBtn" type="button" disabled>다시 뽑기</button>
      </div>
      <div class="sub-actions">
        <button class="btn btn-copy" id="copyBtn" type="button" disabled>결과 복사</button>
      </div>

      <p class="note">인터넷 연결 없이 사용할 수 있습니다.<br>무작위 추천 번호이며 당첨을 보장하지 않습니다.</p>
    </section>
  </main>

  <script>
    "use strict";

    const gamesEl = document.getElementById("games");
    const statusEl = document.getElementById("status");
    const drawBtn = document.getElementById("drawBtn");
    const redrawBtn = document.getElementById("redrawBtn");
    const copyBtn = document.getElementById("copyBtn");
    const gameRadios = document.querySelectorAll('input[name="gameCount"]');
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    let gameCount = 1;
    let currentResults = [];
    let isDrawing = false;
    let rollingTimer = null;
    let drawRun = 0;

    function secureRandomInt(max) {
      if (window.crypto && window.crypto.getRandomValues) {
        const range = 0x100000000;
        const limit = range - (range % max);
        const value = new Uint32Array(1);
        do {
          window.crypto.getRandomValues(value);
        } while (value[0] >= limit);
        return value[0] % max;
      }
      return Math.floor(Math.random() * max);
    }

    function makeNumbers() {
      const pool = Array.from({ length: 45 }, (_, index) => index + 1);
      for (let i = pool.length - 1; i > 0; i -= 1) {
        const j = secureRandomInt(i + 1);
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      return pool.slice(0, 6).sort((a, b) => a - b);
    }

    function randomDisplayNumber() {
      return String(secureRandomInt(45) + 1);
    }

    function renderGames(count) {
      gamesEl.replaceChildren();
      for (let gameIndex = 0; gameIndex < count; gameIndex += 1) {
        const card = document.createElement("section");
        card.className = "game-card";
        card.setAttribute("aria-label", `${gameIndex + 1}게임 번호`);

        const label = document.createElement("p");
        label.className = "game-label";
        label.textContent = `${gameIndex + 1}게임`;

        const balls = document.createElement("div");
        balls.className = "balls";
        for (let ballIndex = 0; ballIndex < 6; ballIndex += 1) {
          const ball = document.createElement("span");
          ball.className = "ball";
          ball.textContent = "?";
          ball.setAttribute("aria-label", `${ballIndex + 1}번째 번호 미정`);
          balls.appendChild(ball);
        }

        card.append(label, balls);
        gamesEl.appendChild(card);
      }
    }

    function getBallRows() {
      return Array.from(document.querySelectorAll(".balls")).map(row => Array.from(row.children));
    }

    function setControlsDuringDraw(drawing) {
      drawBtn.disabled = drawing;
      redrawBtn.disabled = drawing || currentResults.length === 0;
      copyBtn.disabled = drawing || currentResults.length === 0;
      gameRadios.forEach(radio => { radio.disabled = drawing; });
    }

    function pause(milliseconds) {
      return new Promise(resolve => window.setTimeout(resolve, milliseconds));
    }

    async function drawNumbers() {
      if (isDrawing) return;

      isDrawing = true;
      const thisRun = ++drawRun;
      currentResults = Array.from({ length: gameCount }, makeNumbers);
      const ballRows = getBallRows();
      const allBalls = ballRows.flat();

      setControlsDuringDraw(true);
      statusEl.textContent = "행운의 번호를 뽑고 있습니다…";
      allBalls.forEach(ball => {
        ball.classList.remove("confirmed");
        ball.classList.add("rolling");
        ball.textContent = randomDisplayNumber();
      });

      rollingTimer = window.setInterval(() => {
        allBalls.forEach(ball => {
          if (ball.classList.contains("rolling")) ball.textContent = randomDisplayNumber();
        });
      }, reduceMotion ? 180 : 65);

      await pause(reduceMotion ? 120 : 650);

      for (let position = 0; position < 6; position += 1) {
        if (thisRun !== drawRun) return;
        ballRows.forEach((row, gameIndex) => {
          const ball = row[position];
          const number = currentResults[gameIndex][position];
          ball.classList.remove("rolling");
          ball.textContent = number;
          ball.setAttribute("aria-label", `${position + 1}번째 번호 ${number}`);
          void ball.offsetWidth;
          ball.classList.add("confirmed");
        });
        statusEl.textContent = `${position + 1}번째 번호까지 확정되었습니다.`;
        await pause(reduceMotion ? 70 : 300);
      }

      window.clearInterval(rollingTimer);
      rollingTimer = null;
      isDrawing = false;
      statusEl.textContent = `${gameCount}게임 추첨 완료! 행운을 빕니다.`;
      setControlsDuringDraw(false);
    }

    function resetForCount(count) {
      drawRun += 1;
      if (rollingTimer !== null) window.clearInterval(rollingTimer);
      rollingTimer = null;
      isDrawing = false;
      gameCount = count;
      currentResults = [];
      renderGames(gameCount);
      statusEl.textContent = `${gameCount}게임을 선택했습니다. ‘번호 뽑기’를 눌러주세요.`;
      setControlsDuringDraw(false);
    }

    function resultText() {
      const heading = "행운의 로또 추천 번호";
      const lines = currentResults.map((numbers, index) => `${index + 1}게임: ${numbers.join(", ")}`);
      return [heading, ...lines].join("\n");
    }

    async function copyResults() {
      if (currentResults.length === 0) return;
      const text = resultText();
      let copied = false;

      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(text);
          copied = true;
        } catch (_) {
          copied = false;
        }
      }

      if (!copied) {
        const helper = document.createElement("textarea");
        helper.value = text;
        helper.setAttribute("readonly", "");
        helper.style.position = "fixed";
        helper.style.opacity = "0";
        document.body.appendChild(helper);
        helper.select();
        try {
          copied = document.execCommand("copy");
        } catch (_) {
          copied = false;
        }
        helper.remove();
      }

      statusEl.textContent = copied
        ? "추첨 결과를 복사했습니다."
        : "자동 복사가 막혔습니다. 번호를 직접 선택해 복사해주세요.";
    }

    gameRadios.forEach(radio => {
      radio.addEventListener("change", event => resetForCount(Number(event.target.value)));
    });
    drawBtn.addEventListener("click", drawNumbers);
    redrawBtn.addEventListener("click", drawNumbers);
    copyBtn.addEventListener("click", copyResults);

    renderGames(gameCount);
  </script>
</body>
</html>
