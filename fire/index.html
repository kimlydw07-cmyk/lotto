<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>불꽃놀이</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #02030a;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    background: radial-gradient(ellipse at 50% 100%, #14204a 0%, #090d24 50%, #02030a 100%);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  }
  canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #fx {
    touch-action: none;
    cursor: crosshair;
  }
  h1 {
    position: fixed;
    top: 7vh;
    left: 0;
    right: 0;
    margin: 0;
    text-align: center;
    font-size: clamp(2.2rem, 10vw, 5rem);
    font-weight: 800;
    letter-spacing: 0.18em;
    text-indent: 0.18em;
    color: #fff;
    text-shadow: 0 0 12px rgba(255, 220, 140, 0.8),
                 0 0 32px rgba(255, 140, 80, 0.55),
                 0 0 64px rgba(255, 80, 160, 0.4);
    pointer-events: none;
  }
  .hint {
    position: fixed;
    bottom: 6vh;
    left: 0;
    right: 0;
    text-align: center;
    font-size: clamp(0.95rem, 4vw, 1.2rem);
    color: rgba(255, 255, 255, 0.65);
    pointer-events: none;
    transition: opacity 1s;
    animation: pulse 2s ease-in-out infinite;
  }
  .hint.hide {
    opacity: 0;
    animation: none;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.85; }
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<canvas id="fx"></canvas>
<h1>불꽃놀이</h1>
<div class="hint" id="hint">화면을 터치하거나 클릭해 보세요</div>

<script>
(function () {
  var sky = document.getElementById('sky');
  var sctx = sky.getContext('2d');
  var cv = document.getElementById('fx');
  var ctx = cv.getContext('2d');
  var hint = document.getElementById('hint');

  var W = 0, H = 0, dpr = 1;
  var particles = [];
  var flashes = [];
  var MAX_PARTICLES = 1800;

  function rand(a, b) { return a + Math.random() * (b - a); }

  function drawStars() {
    sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    sctx.clearRect(0, 0, W, H);
    var n = Math.floor((W * H) / 3500);
    for (var i = 0; i < n; i++) {
      var r = Math.random() < 0.08 ? rand(1.2, 1.8) : rand(0.3, 1.1);
      sctx.globalAlpha = rand(0.25, 0.95);
      sctx.fillStyle = Math.random() < 0.2 ? '#cfe0ff' : '#ffffff';
      sctx.beginPath();
      sctx.arc(Math.random() * W, Math.random() * H, r, 0, Math.PI * 2);
      sctx.fill();
    }
    sctx.globalAlpha = 1;
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    sky.width = cv.width = Math.floor(W * dpr);
    sky.height = cv.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawStars();
  }

  function burst(x, y) {
    var scale = Math.max(0.7, Math.min(1.3, Math.min(W, H) / 700));
    var count = Math.floor(rand(80, 130));
    var baseHue = rand(0, 360);
    var colorMode = Math.floor(rand(0, 3));   // 0: 단색, 1: 두 가지 색, 2: 무지개
    var ring = Math.random() < 0.35;          // 링 모양 / 둥근 모양
    var power = rand(2.2, 4.2) * scale;

    for (var i = 0; i < count; i++) {
      var angle, speed;
      if (ring) {
        angle = (i / count) * Math.PI * 2;
        speed = power * rand(0.95, 1.05);
      } else {
        angle = rand(0, Math.PI * 2);
        speed = power * Math.sqrt(Math.random());
      }

      var hue;
      if (colorMode === 0) hue = baseHue + rand(-14, 14);
      else if (colorMode === 1) hue = (i % 2 ? baseHue : baseHue + 160) + rand(-10, 10);
      else hue = rand(0, 360);

      particles.push({
        x: x, y: y, px: x, py: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: rand(0.008, 0.018),
        hue: hue,
        size: rand(1.4, 2.8),
        twinkle: Math.random() < 0.3
      });
    }

    if (particles.length > MAX_PARTICLES) {
      particles.splice(0, particles.length - MAX_PARTICLES);
    }
    flashes.push({ x: x, y: y, life: 1, hue: baseHue });
  }

  var last = performance.now();
  function frame(now) {
    var dt = Math.min((now - last) / 16.67, 3);
    last = now;

    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';

    for (var f = flashes.length - 1; f >= 0; f--) {
      var fl = flashes[f];
      var rad = 140 * (1.2 - fl.life * 0.4);
      var g = ctx.createRadialGradient(fl.x, fl.y, 0, fl.x, fl.y, rad);
      g.addColorStop(0, 'hsla(' + fl.hue + ',100%,80%,' + (0.4 * fl.life) + ')');
      g.addColorStop(1, 'hsla(' + fl.hue + ',100%,60%,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(fl.x, fl.y, rad, 0, Math.PI * 2);
      ctx.fill();
      fl.life -= 0.07 * dt;
      if (fl.life <= 0) flashes.splice(f, 1);
    }

    var drag = Math.pow(0.978, dt);
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.px = p.x;
      p.py = p.y;
      p.vx *= drag;
      p.vy = p.vy * drag + 0.045 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= p.decay * dt;

      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }

      var a = p.life;
      if (p.twinkle && Math.random() < 0.3) a *= 0.3;
      ctx.strokeStyle = 'hsla(' + p.hue + ',100%,' + (55 + 25 * p.life) + '%,' + a + ')';
      ctx.lineWidth = p.size * (0.4 + p.life * 0.6);
      ctx.beginPath();
      ctx.moveTo(p.px, p.py);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }

    ctx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(frame);
  }

  function onPointer(e) {
    e.preventDefault();
    burst(e.clientX, e.clientY);
    hint.classList.add('hide');
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  cv.addEventListener('pointerdown', onPointer);

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
